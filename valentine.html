
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>For Ms Kaylin Cloete 💖</title>
  <style>
    :root{
      --bg1:#ffd6e7; --bg2:#ffeef6; --card:#ffffffcc;
      --yes:#ff3b7a; --yesHover:#ff1f68; --txt:#2a2630;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; min-height:100svh; display:grid; place-items:center;
      background:radial-gradient(circle at top,var(--bg2),var(--bg1));
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color:var(--txt); overflow:hidden; padding:16px;
    }
    /* Fullscreen confetti canvas */
    #confettiCanvas{
      position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; z-index:9999;
    }
    .card{
      width:min(760px,94vw);
      padding:clamp(20px,4.8vw,32px);
      background:var(--card);
      -webkit-backdrop-filter:blur(10px);
      backdrop-filter:blur(10px);
      border-radius:22px;
      text-align:center;
      box-shadow:0 18px 60px rgba(0,0,0,.15);
      animation:pop .35s ease;
    }
    .art{ width:min(260px,80vw); margin:0 auto 10px; display:block; filter:drop-shadow(0 10px 14px rgba(0,0,0,.12)); }
    h1{ font-size:clamp(26px,4.5vw,44px); margin:12px 0 18px; line-height:1.2; }
    .button-zone{
      position:relative; width:min(520px,92%); height:160px; margin:0 auto; touch-action:none; overflow:hidden;
    }
    button{
      position:absolute; top:50%; transform:translateY(-50%);
      padding:16px 24px; font-size:18px; font-weight:800;
      border-radius:999px; border:none; cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,.14);
      -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
      transition:transform .12s ease, background .12s ease;
    }
    #yesBtn{ left:18%; background:var(--yes); color:#fff; }
    #yesBtn:hover{ background:var(--yesHover); }
    #noBtn{ left:62%; background:#e5e7eb; color:#111827; }
    .hint{ margin-top:10px; font-size:13px; opacity:.7; }
    .hidden{ display:none !important; }
    @keyframes pop{ from{ transform:scale(.96); opacity:0 } to{ transform:scale(1); opacity:1 } }
  </style>
</head>
<body>
  <!-- Confetti layer -->
  <canvas id="confettiCanvas"></canvas>

  <!-- View 1: Question -->
  <main id="questionView" class="card" role="main" aria-live="polite">
    <!-- Cute animal with heart (SVG) -->
    <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="fur" x1="0" x2="1">
          <stop offset="0" stop-color="#f7c7a1"/>
          <stop offset="1" stop-color="#f2a97b"/>
        </linearGradient>
        <linearGradient id="heart" x1="0" x2="1">
          <stop offset="0" stop-color="#ff4d7d"/>
          <stop offset="1" stop-color="#ff1f68"/>
        </linearGradient>
      </defs>
      <path d="M250 50 C250 33 270 25 282 38
               C294 25 314 33 314 50
               C314 78 282 92 282 106
               C282 92 250 78 250 50Z"
            fill="url(#heart)"/>
      <path d="M90 120 C90 70 140 40 190 60
               C240 40 290 70 290 120
               C290 180 240 210 190 210
               C140 210 90 180 90 120Z"
            fill="url(#fur)"/>
      <path d="M110 92 L95 55 L140 78 Z" fill="#f2a97b"/>
      <path d="M270 92 L285 55 L240 78 Z" fill="#f2a97b"/>
      <circle cx="160" cy="130" r="8"/>
      <circle cx="220" cy="130" r="8"/>
      <path d="M190 144 C186 144 182 148 182 152
               C182 160 190 164 190 170
               C190 164 198 160 198 152
               C198 148 194 144 190 144Z"
            fill="#ff7aa2"/>
    </svg>

    <h1>Ms Kaylin Cloete, will you be my Valentine? 💘</h1>

    <section class="button-zone" id="zone">
      <button id="yesBtn" aria-label="Yes">Yes</button>
      <button id="noBtn" aria-hidden="true" tabindex="-1">No</button>
    </section>

    <div class="hint" id="hint">“No” seems a bit shy 😈</div>
  </main>

  <!-- View 2: Confirmation -->
  <main id="confirmationView" class="card hidden" aria-live="polite">
    <h1>It’s a date, Ms Kaylin Cloete! 💞</h1>
